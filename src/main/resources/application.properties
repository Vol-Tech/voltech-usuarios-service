spring.jpa.hibernate.ddl-auto=validate

google.client-id=${GOOGLE_CLIENT_ID:990836592049-vr0tpb8envclh0dsn2f2c2lj99hbr66d.apps.googleusercontent.com}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
